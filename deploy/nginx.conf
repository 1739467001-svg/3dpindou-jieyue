# ============================================================
# BeadOrbit nginx 配置模板
# 用法：复制到服务器 /etc/nginx/conf.d/beadorbit.conf，
#       修改 server_name 与 root 后 nginx -t && systemctl reload nginx
# 关键点：
#   1. COOP/COEP 响应头 —— 启用 ONNX Runtime 多线程 WASM（无则退化单线程，慢 5-10 倍）
#   2. wasm/onnx 长缓存 —— 26MB 模型 + 83MB 运行时只下载一次
#   3. gzip —— JS/CSS 可压；wasm/onnx 本身已压缩，开 precompressed 更有意义（见下）
# ============================================================

server {
    listen 80;
    server_name beadorbit.example.com;   # ← 改成你的域名

    # 配好 HTTPS 后取消注释，强制跳转
    # return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name beadorbit.example.com;   # ← 改成你的域名

    # ← 证书路径（阿里云/腾讯云可下载免费证书；或用 certbot 自动签）
    ssl_certificate     /etc/nginx/ssl/beadorbit.pem;
    ssl_certificate_key /etc/nginx/ssl/beadorbit.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/beadorbit;             # ← 部署目录
    index index.html;

    # ---- 跨域隔离头（多线程 AI 推理的开关，勿删）----
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # ---- 压缩 ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    client_max_body_size 64m;   # 允许上传较大素材

    location / {
        try_files $uri $uri/ =404;
        # HTML 不缓存，保证发新版本立即生效
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }
    }

    # 模型与 WASM 运行时：长缓存（文件名不变则内容不变）
    location ~* \.(wasm|onnx)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 其他静态资源：一天
    location ~* \.(js|css|svg|png|jpg|woff2)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/beadorbit.access.log;
    error_log  /var/log/nginx/beadorbit.error.log;
}
